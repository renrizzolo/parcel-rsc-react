[package]
name = "parcel-reporter-docgen"
version = "0.1.0-beta.9"
edition = "2024"
license = "MIT"
description = "Parcel reporter that generates TypeScript component prop documentation on build"
repository = "https://github.com/renrizzolo/parcel-rsc-react.git"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
parcel-plugin = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
