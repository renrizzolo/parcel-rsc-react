name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-native-plugins:
    name: Check Native Plugins
    runs-on: ubuntu-latest
    outputs:
      needs_publish: ${{ steps.check.outputs.needs_publish }}
      paths: ${{ steps.check.outputs.paths }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check unpublished native plugins
        id: check
        run: node scripts/check-native-plugins.mjs packages/parcel-plugin-rsc-router packages/parcel-reporter-docgen

  publish-native-plugins:
    name: Publish Native Plugins
    needs: check-native-plugins
    if: needs.check-native-plugins.outputs.needs_publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: parcel-bundler/parcel/.github/workflows/native-plugin.yml@v3.0.0-alpha.3
    with:
      paths: ${{ needs.check-native-plugins.outputs.paths }}
      publish: true

  release:
    name: Release
    needs: [check-native-plugins, publish-native-plugins]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.22.0

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for native plugins on npm
        if: needs.check-native-plugins.outputs.needs_publish == 'true'
        run: node scripts/check-native-plugins.mjs --wait packages/parcel-plugin-rsc-router packages/parcel-reporter-docgen

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
